target-version = "py312"
line-length = 100

[lint]
# E/F: pycodestyle and pyflakes errors, I: import sorting, B: common bugs, UP: modern syntax.
select = ["E", "F", "I", "B", "UP"]

[lint.isort]
# The local alembic/ folder would otherwise make ruff treat the alembic library as our own code.
known-first-party = ["app"]
known-third-party = ["alembic"]
