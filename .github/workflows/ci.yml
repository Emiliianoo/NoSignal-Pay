name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nosignal
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: nosignal_pay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nosignal -d nosignal_pay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # CI-only values for a throwaway database; real secrets never go in this file.
      DATABASE_URL: postgresql+psycopg://nosignal:ci-password@localhost:5432/nosignal_pay
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # Same version we use locally, so CI and our laptops agree.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
