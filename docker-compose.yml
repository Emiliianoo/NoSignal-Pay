services:
  postgres:
    image: postgres:17
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Mount the source code so --reload picks up changes without rebuilding the image.
      - ./api:/code
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
